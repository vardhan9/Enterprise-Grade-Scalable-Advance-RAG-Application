# Baseline snapshot — system + eval configuration for this run.
# Captures model, retrieval, chunking, reranking, and generation settings.

run:
  name: baseline_local_minilm
  notes: "embedding=all-MiniLM-L12-v2 (local, dim=384); llm=qwen/qwen3.8-27b temp=0; chunk=paragraph/1500 overlap=0; retrieve=15→5 reranker=ms-marco-MiniLM-L-6-v2"

system:
  embedding_backend: local          # local | gemini
  embedding_model: all-MiniLM-L12-v2
  embedding_dim: 384
  llm_model: qwen/qwen3.8-27b
  llm_temperature: 0
  llm_max_tokens: 1000              # app/gateway/client.py get_langchain_llm
  collection: enterprise-rag

chunking:
  strategy: paragraph               # app/ingestion/chunking/splitter.py
  chunk_size: 1500                  # characters; packs paragraphs until size
  chunk_overlap: 0                  # CONFIRMED — no overlap parameter; hard boundary between chunks
  implementation: "split on \\n\\n paragraphs; no sliding-window overlap"

retrieval:
  search_limit: 15                  # Qdrant candidates (retriever.py)
  rerank_top_n: 5                   # kept after FlashRank
  reranker: ms-marco-MiniLM-L-6-v2  # FlashRank local ONNX

generation:
  response_style: grounded_enterprise
  max_context_chars_in_prompt: 25000  # responder.py

eval:
  api_url: http://localhost:8000/query
  golden_dataset: evals/golden_dataset.json
  response_truncate: 300
  delay_between_calls: 10
  request_timeout: 300
  guardrails_timeout: 30
  guardrails_delay: 2
  judge_model: "@rag-enterprise-openrouter/openai/gpt-4o-mini"
  judge_embeddings: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 1
  context_truncate: 300
  context_limit: 2
