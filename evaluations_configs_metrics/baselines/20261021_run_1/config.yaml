# Snapshot of system configuration for this run
# (model, retrieval, chunking, reranking, prompts, generation).
# Copied from evaluations_configs_metrics/config.yaml at persist time.

run:
  name: baseline_local_minilm
  notes: "Placeholder baseline folder — replace by running Step 3 metrics"

system:
  embedding_backend: local
  embedding_model: all-MiniLM-L12-v2
  embedding_dim: 384
  llm_model: qwen/qwen3.8-27b
  llm_temperature: 0
  collection: enterprise-rag

chunking:
  strategy: paragraph
  chunk_size: 1500

retrieval:
  search_limit: 15
  rerank_top_n: 5
  reranker: ms-marco-MiniLM-L-6-v2

generation:
  response_style: grounded_enterprise
  max_context_chars_in_prompt: null

eval:
  api_url: http://localhost:8000/query
  golden_dataset: evals/golden_dataset.json
  response_truncate: 300
  delay_between_calls: 10
  request_timeout: 300
  guardrails_timeout: 30
  guardrails_delay: 2
  judge_model: "@rag-enterprise-openrouter/openai/gpt-4o-mini"
  judge_embeddings: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 1
  context_truncate: 300
  context_limit: 2
